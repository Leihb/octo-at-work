[book]
title = "让 agent 替你干活 · 不写代码，用 octo 把活干完"
description = "给不写代码的打工人的一本书：用一个本地 agent harness（octo）把真实的活干完。安装、把活说清楚、17 章一个活一个功能、6 个端到端案例、附录速查。"
authors = ["Roy Lei"]
language = "zh-CN"
src = "src"

[output.html]
git-repository-url = "https://github.com/Leihb/octo-at-work"
edit-url-template = "https://github.com/Leihb/octo-at-work/edit/main/{path}"
default-theme = "rust"
preferred-dark-theme = "navy"
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js"]

[output.html.fold]
enable = true
level = 0
